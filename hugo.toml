# =============================================================================
# Example: Multiple content folders, single language
# Content: content/en/posts/post.md (content in language-specific directory)
# Use contentDir when organizing content by language even for single-language sites.
# See: https://gohugo.io/content-management/multilingual/
# =============================================================================

baseURL = 'https://www.w0wml.org/'
theme = "mana"
defaultContentLanguage = "en"

[pagination]
  pageSize = 5

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[outputs]
  home = ["HTML", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  enableIntegrity = false
  relatedPostsCount = 3
  description = "Newton Amaateur Radio Assocation. Connecting Amaateur Radio Operators in Jasper and Poweshiek Counties!"
  author = "Your Name"
  heroTitleLine1 = "Newton Amatuer Radio Assocation, Inc"
  heroTitleLine2 = ""
  footerText = ""

  [params.social]
    github = "https://github.com/w0wmlnewton"
    linkedin = ""
    twitter = ""
    email = "info@w0wml.org"

  [params.buyMeACoffee]
    enabled = false
    id = "yourwidgetid"

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 1984
    owner = "Newton Amatuer Radio Assocation, Inc"

  [params.admonitions]
    alertStyle = "favicon"

# =============================================================================
# Translation by directory: contentDir points to language-specific content folder.
# Single language: only the default language needs a [languages] block with contentDir.
# =============================================================================

[languages.en]
  languageCode = "en-US"
  languageName = "English"
  languageDirection = "ltr"
  contentDir = "content/en"
  weight = 1
  title = " Newton Amatuer Radio Assocation | W0WML"

  [languages.en.params]
    description = "Newton Amaateur Radio Assocation. Connecting Amaateur Radio Operators in Jasper and Poweshiek Counties!"
    heroTitleLine1 = "Newton Amatuer Radio Assocation, Inc"
    heroTitleLine2 = ""
    custom404Message = "Sorry, the page you are looking for could not be found."
    footerText = ""

  [[languages.en.menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[languages.en.menus.main]]
    name = "About"
    url = "about"
    weight = 20
